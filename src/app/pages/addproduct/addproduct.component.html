<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="text-center text-success mb-4">➕ Add New Product</h3>

    <div *ngIf="successMessage" class="alert alert-success text-center">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger text-center">{{ errorMessage }}</div>

    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input class="form-control" [(ngModel)]="product.name" placeholder="e.g. Wireless Headphones" />
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" [(ngModel)]="product.description" placeholder="e.g. Ergonomic RGB Keyboard"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Price (₹)</label>
      <input type="number" class="form-control" [(ngModel)]="product.price" />
    </div>

    <div class="mb-3">
      <label class="form-label">Quantity</label>
      <input type="number" class="form-control" [(ngModel)]="product.quantity" />
    </div>

    <div class="mb-3">
      <label class="form-label">Image URL</label>
      <input class="form-control" [(ngModel)]="product.imgurl" placeholder="Paste a valid image URL" />
    </div>

    <div class="d-grid">
      <button class="btn btn-success fw-semibold" (click)="addProduct()">Add Product</button>
    </div>
  </div>
</div>
